<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ELANG PHANTOM</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        overflow-x: hidden;
    }

    header {
        background: #080808;
        padding: 20px;
        text-align: center;
        font-size: 32px;
        letter-spacing: 3px;
        color: #ff0000;
        text-shadow: 0 0 20px red;
        border-bottom: 1px solid red;
    }

    .container {
        padding: 20px;
        text-align: center;
    }

    /* Elang di tengah */
    .elang {
        width: 260px;
        filter: drop-shadow(0 0 20px red);
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
    }

    /* Tombol */
    .btn {
        display: block;
        width: 80%;
        margin: 12px auto;
        padding: 14px;
        background: #111;
        border: 1px solid red;
        border-radius: 8px;
        color: #ff4d4d;
        font-size: 20px;
        text-align: center;
        text-decoration: none;
        transition: 0.2s;
        cursor: pointer;
    }

    .btn:hover {
        background: red;
        color: white;
        box-shadow: 0 0 20px red;
    }

    /* Panel popup */
    .panel {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #111;
        border: 1px solid red;
        border-radius: 10px;
        box-shadow: 0 0 20px red;
    }
</style>

<script>
    function toggle(id){
        let p = document.getElementById(id);
        p.style.display = (p.style.display === "block") ? "none" : "block";
    }
</script>

</head>
<body>

<header>ELANG PHANTOM</header>

<div class="container">

    <!-- FOTO ELANG -->
    <img src="https://raw.githubusercontent.com/elangphantom/elgphtm/main/6031af25-04e6-4fe9-ba9d-295a27027ccf.jpeg"
         class="elang" alt="Elang Phantom">

    <!-- TOMBOL -->
    <div class="btn" onclick="toggle('info')">📌 Informasi</div>
    <div class="btn" onclick="toggle('animasi')">🕶️ Animasi Mafia</div>
    <div class="btn" onclick="toggle('suara')">🔊 Suara Elang</div>
    <div class="btn" onclick="toggle('credit')">💀 Creator</div>

    <!-- PANEL 1 -->
    <div id="info" class="panel">
        Website dark-mode bertema Elang Phantom.  
        Dibuat penuh efek glowing merah + animasi.
    </div>

    <!-- PANEL 2 -->
    <div id="animasi" class="panel">
        <img src="https://i.ibb.co/7vYr3QB/siluet-mafia-walk.gif"
             style="width:220px; filter: drop-shadow(0 0 20px red);">
    </div>

    <!-- PANEL 3 -->
    <div id="suara" class="panel">
        <audio controls>
            <source src="https://www.soundjay.com/nature/sounds/eagle-1.mp3" type="audio/mp3">
        </audio>
    </div>

    <!-- PANEL 4 -->
    <div id="credit" class="panel">
        Dibuat oleh <b>Elang Phantom</b>.  
        Gaya Dark Web 🔥
    </div>

</div>

</body>
</html>
