<!DOCTYPE html>
<html>
<head>
    <title>Phantom Neon Web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            color: #0ff;
            text-align: center;
        }

        .container {
            padding-top: 100px;
        }

        h1 {
            font-size: 40px;
            text-shadow: 0 0 10px cyan, 0 0 20px cyan;
        }

        p {
            color: #aaa;
            font-size: 18px;
        }

        img {
            width: 250px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px cyan;
        }

        .glow {
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px cyan; }
            to { text-shadow: 0 0 20px cyan; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="glow">Welcome to Phantom Web</h1>
        <p>Website pertama gue, gak main-main!</p>

        <img src="https://i.ibb.co/BC0Rmnh/ghost-warrior.jpg" alt="Neon Image">
    </div>

</body>
</html>
