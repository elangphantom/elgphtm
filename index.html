<audio id="clickSound" preload="auto">
   <source src="https://cdn.pixabay.com/download/audio/2021/09/26/audio_3a771ad45d.mp3?filename=eagle-sound-123983.mp3">
</audio>

<script>
function playSound() {
    const sound = document.getElementById("clickSound");
    sound.currentTime = 0;      // restart suara tiap klik
    sound.muted = false;
    sound.volume = 1.0;
    sound.play().catch(err => {
        console.log("Browser block:", err);
    });
}
</script>
