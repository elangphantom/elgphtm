<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Elang Phantom – Dark Web Style</title><style>
    /* ==== GLOBAL DARKWEB VIBES ==== */
    body {
        margin: 0;
        font-family: "Courier New", monospace;
        background: #000000;
        color: #00ff41;
        text-shadow: 0 0 8px #00ff41;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        overflow-x: hidden;
    }

    /* ==== HEADER BAR ==== */
    .header {
        width: 100%;
        padding: 20px;
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        background: linear-gradient(90deg, #000, #111, #000);
        border-bottom: 2px solid #00ff41;
    }

    /* ==== FLYING EAGLE ==== */
    .eagle {
        width: 300px;
        margin-top: 40px;
        filter: drop-shadow(0 0 20px red);
        animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0); }
    }

    /* ==== BUTTONS ==== */
    .btn {
        margin-top: 40px;
        padding: 12px 25px;
        border: 1px solid #00ff41;
        background: rgba(0, 0, 0, 0.4);
        color: #00ff41;
        cursor: pointer;
        font-size: 18px;
        border-radius: 5px;
        transition: 0.2s;
    }

    .btn:hover {
        background: #00ff41;
        color: #000;
        text-shadow: none;
    }

    /* ==== TERMINAL BOX ==== */
    .terminal {
        margin-top: 40px;
        width: 80%;
        max-width: 700px;
        background: #050505;
        border: 2px solid #00ff41;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 15px #00ff41;
    }

    .line {
        margin: 5px 0;
    }
</style>

</head><body>
    <div class="header">ELANG PHANTOM // DARK SYSTEM v1.0</div><img class="eagle" src="https://i.ibb.co/0s48Lhq/eagle.png" alt="Elang Phantom" />

<button class="btn" onclick="playSound()">PLAY ELANG SCREAM</button>

<div class="terminal">
    <div class="line">[ACCESS] Connecting to Phantom Network...</div>
    <div class="line">[STATUS] Success.</div>
    <div class="line">[INFO] Elang Phantom aktif.</div>
    <div class="line">[LOG] Mode: DARK-WEB INTERFACE</div>
</div>

<audio id="elangSound" src="elang.mp3"></audio>

<script>
    function playSound() {
        const audio = document.getElementById('elangSound');
        audio.volume = 1.0;
        audio.play();
    }
</script>

</body>
</html>
