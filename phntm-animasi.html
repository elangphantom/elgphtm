<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phantom Animasi</title>

    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Background merah glowing */
        .red-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0.25) 0%, rgba(0,0,0,1) 80%);
            z-index: 1;
        }

        /* GIF mafia */
        .walker {
            position: absolute;
            bottom: 0;
            width: 280px;
            animation: walk 8s linear infinite;
            z-index: 2;
        }

        /* Animasi jalan */
        @keyframes walk {
            0% { left: -300px; }
            100% { left: 100%; }
        }

        /* Judul */
        .title {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 40px;
            color: #ff0000;
            text-shadow: 0 0 20px red;
            z-index: 3;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="red-glow"></div>

    <div class="title">PHANTOM ANIMATION</div>

    <!-- GIF siluet mafia jalan -->
    <img class="walker" 
         src="https://i.ibb.co/7vYr3QB/siluet-mafia-walk.gif" 
         alt="phantom mafia">

</body>
</html>
